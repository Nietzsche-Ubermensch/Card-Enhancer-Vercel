name: Card Enhancer CI — Real-ESRGAN Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  UPSCALE_BACKEND: realesrgan

jobs:
  # ------------------------------------------------------------------ #
  #  Gate: validate that required secrets are configured                 #
  # ------------------------------------------------------------------ #
  validate-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check HF_API_TOKEN
        run: |
          if [ -z "${{ secrets.HF_API_TOKEN }}" ]; then
            echo "::error::HF_API_TOKEN secret is not set. Add it under Settings → Secrets."
            exit 1
          fi
          echo "✅ HF_API_TOKEN is set (length: ${#TOKEN})"
        env:
          TOKEN: ${{ secrets.HF_API_TOKEN }}

      - name: Check REPLICATE_API_TOKEN
        run: |
          if [ -z "${{ secrets.REPLICATE_API_TOKEN }}" ]; then
            echo "::error::REPLICATE_API_TOKEN secret is not set. Add it under Settings → Secrets."
            exit 1
          fi
          echo "✅ REPLICATE_API_TOKEN is set (length: ${#TOKEN})"
        env:
          TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}

  # ------------------------------------------------------------------ #
  #  Main pipeline test                                                  #
  # ------------------------------------------------------------------ #
  pipeline-test:
    needs: validate-secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
      REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate deterministic test card
        run: |
          python tests/generate_test_card.py \
            --output tests/fixtures/test_card.png \
            --worn
          echo "TEST_INPUT=tests/fixtures/test_card.png" >> "$GITHUB_ENV"
          echo "TEST_OUTPUT=tests/fixtures/output_card.png" >> "$GITHUB_ENV"

      - name: Run Real-ESRGAN pipeline
        id: pipeline
        run: |
          START=$(date +%s.%N)

          python -c "
          import os, sys
          os.environ['UPSCALE_BACKEND'] = 'realesrgan'

          from app.services.upscalers.realesrgan_backend import RealESRGANBackend

          backend = RealESRGANBackend()
          result = backend.enhance(
              input_path='${{ env.TEST_INPUT }}',
              output_path='${{ env.TEST_OUTPUT }}',
              opts={
                  'upscale_factor': 4,
                  'denoise': True,
                  'format': 'png',
                  'quality': 95,
              },
          )
          print(f'Pipeline output: {result}')
          "

          END=$(date +%s.%N)
          ELAPSED=$(python3 -c "print(round($END - $START, 2))")
          echo "elapsed=$ELAPSED" >> "$GITHUB_OUTPUT"
          echo "Pipeline completed in ${ELAPSED}s"

      - name: Compute quality metrics
        id: metrics
        run: |
          python tests/quality_metrics.py \
            --input  "${{ env.TEST_INPUT }}" \
            --output "${{ env.TEST_OUTPUT }}" \
            --time   "${{ steps.pipeline.outputs.elapsed }}" \
            --summary-file /tmp/metrics_summary.md \
            --json

      - name: Upload output image as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-output
          path: |
            ${{ env.TEST_INPUT }}
            ${{ env.TEST_OUTPUT }}
          retention-days: 7

      - name: Post job summary
        if: always()
        run: |
          if [ -f /tmp/metrics_summary.md ]; then
            cat /tmp/metrics_summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Real-ESRGAN Pipeline — CI Results" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ Metrics summary was not generated." >> "$GITHUB_STEP_SUMMARY"
            echo "The pipeline may have failed before metrics could be computed." >> "$GITHUB_STEP_SUMMARY"
          fi

          # Always append run metadata
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "---" >> "$GITHUB_STEP_SUMMARY"
          echo "*Run:* \`${{ github.run_id }}\` | *Commit:* \`${{ github.sha }}\` | *Branch:* \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
