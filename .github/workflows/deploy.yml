name: Card Enhancer CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── 1. Secrets gate ────────────────────────────────────────────────────
  validate-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check HF_API_TOKEN
        run: |
          if [ -z "${{ secrets.HF_API_TOKEN }}" ]; then
            echo "::error::HF_API_TOKEN not set. Add it under Settings → Secrets."
            exit 1
          fi
          echo "✅ HF_API_TOKEN set"

      - name: Check REPLICATE_API_TOKEN
        run: |
          if [ -z "${{ secrets.REPLICATE_API_TOKEN }}" ]; then
            echo "::error::REPLICATE_API_TOKEN not set. Add it under Settings → Secrets."
            exit 1
          fi
          echo "✅ REPLICATE_API_TOKEN set"

  # ── 2. YOLO quality gate (no secrets needed — weights optional) ────────
  yolo-quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate test card
        run: |
          python tests/generate_test_card.py \
            --output tests/fixtures/scene_card.png \
            --worn

      - name: YOLO detection quality gate
        run: |
          python - <<'EOF'
          import sys
          from PIL import Image
          from app.services.card_detector import is_available, detect_and_crop_detailed

          img = Image.open("tests/fixtures/scene_card.png")
          print(f"Input size: {img.size}")

          if not is_available():
              print("YOLO weights not present — gate skipped (place weights at models/card_detector_obb.pt to activate)")
              sys.exit(0)

          result = detect_and_crop_detailed(img)
          print(f"Detected:   {result.detected}")
          print(f"Confidence: {result.confidence:.3f}")
          print(f"Input size: {result.original_size}")
          print(f"Crop size:  {result.cropped_size}")

          assert result.detected, "YOLO failed to detect card"
          assert result.confidence >= 0.55, f"Confidence {result.confidence:.3f} below 0.55"
          assert result.cropped_size != result.original_size, "No crop occurred"

          print("✅ All YOLO quality gates passed")
          EOF

  # ── 3. Full pipeline test ──────────────────────────────────────────────
  pipeline-test:
    needs: validate-secrets
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
      REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
      UPSCALE_BACKEND: realesrgan

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate test card
        run: |
          python tests/generate_test_card.py \
            --output tests/fixtures/test_card.png \
            --worn
          echo "TEST_INPUT=tests/fixtures/test_card.png" >> "$GITHUB_ENV"
          echo "TEST_OUTPUT=tests/fixtures/output_card.png" >> "$GITHUB_ENV"

      - name: Run enhancement pipeline
        id: pipeline
        run: |
          START=$(date +%s.%N)
          python -c "
import os
os.environ['UPSCALE_BACKEND'] = 'realesrgan'
from app.services.enhancement_service import EnhancementService
svc = EnhancementService()
result = svc.enhance_image(
    input_path='tests/fixtures/test_card.png',
    opts={'upscale_factor': 4, 'denoise': True, 'format': 'png', 'quality': 95, 'auto_crop': True},
)
print(f'Output: {result}')
"
          END=$(date +%s.%N)
          ELAPSED=$(python3 -c "print(round($END - $START, 2))")
          echo "elapsed=$ELAPSED" >> "$GITHUB_OUTPUT"

      - name: Compute quality metrics
        run: |
          python tests/quality_metrics.py \
            --input  "${{ env.TEST_INPUT }}" \
            --output "${{ env.TEST_OUTPUT }}" \
            --time   "${{ steps.pipeline.outputs.elapsed }}" \
            --summary-file /tmp/metrics_summary.md \
            --json

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-output
          path: |
            ${{ env.TEST_INPUT }}
            ${{ env.TEST_OUTPUT }}
          retention-days: 7

      - name: Post job summary
        if: always()
        run: |
          if [ -f /tmp/metrics_summary.md ]; then
            cat /tmp/metrics_summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ Metrics summary not generated." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "---" >> "$GITHUB_STEP_SUMMARY"
          echo "*Run:* \`${{ github.run_id }}\` | *Commit:* \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
