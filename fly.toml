# Fly.io configuration — builds from the root Dockerfile.
#   fly launch --no-deploy   # first time only (generates app name)
#   fly deploy
app = "card-enhancer"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  USE_GPU = "false"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "40s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 1
